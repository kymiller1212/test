<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBuddy - Reading Made Fun!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260208-2000">
</head>
<body>
  <!-- ===== SETTINGS PANEL (slide-out) ===== -->
  <div id="settings-panel" class="settings-panel" aria-label="Reading settings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="close-settings" class="icon-btn" aria-label="Close settings">&#x2715;</button>
    </div>
    <div class="settings-body">
      <div class="setting-group">
        <label for="font-size-slider">Text Size</label>
        <input type="range" id="font-size-slider" min="18" max="36" value="24" step="2">
        <span id="font-size-value">24px</span>
      </div>
      <div class="setting-group">
        <label for="letter-spacing-slider">Letter Spacing</label>
        <input type="range" id="letter-spacing-slider" min="0" max="8" value="3" step="1">
        <span id="letter-spacing-value">0.12em</span>
      </div>
      <div class="setting-group">
        <label for="word-spacing-slider">Word Spacing</label>
        <input type="range" id="word-spacing-slider" min="0" max="12" value="4" step="1">
        <span id="word-spacing-value">0.16em</span>
      </div>
      <div class="setting-group">
        <label for="line-height-slider">Line Height</label>
        <input type="range" id="line-height-slider" min="16" max="30" value="22" step="1">
        <span id="line-height-value">2.2</span>
      </div>
      <div class="setting-group">
        <label for="speed-slider">Reading Speed</label>
        <input type="range" id="speed-slider" min="5" max="15" value="8" step="1">
        <span id="speed-value">Slow</span>
      </div>
      <div class="setting-group">
        <label>Background Color</label>
        <div class="color-options">
          <button class="color-btn active" data-color="#FFF8E7" style="background:#FFF8E7;" aria-label="Cream background"></button>
          <button class="color-btn" data-color="#E8F5E9" style="background:#E8F5E9;" aria-label="Light green background"></button>
          <button class="color-btn" data-color="#E3F2FD" style="background:#E3F2FD;" aria-label="Light blue background"></button>
          <button class="color-btn" data-color="#FFF3E0" style="background:#FFF3E0;" aria-label="Peach background"></button>
          <button class="color-btn" data-color="#F3E5F5" style="background:#F3E5F5;" aria-label="Lavender background"></button>
          <button class="color-btn" data-color="#FFFFFF" style="background:#FFFFFF;border:1px solid #ccc;" aria-label="White background"></button>
        </div>
      </div>
      <div class="setting-group">
        <label class="toggle-label">
          <span>Reading Ruler</span>
          <input type="checkbox" id="ruler-toggle" checked>
          <span class="toggle-switch"></span>
        </label>
      </div>
      <div class="setting-group">
        <label class="toggle-label">
          <span>Syllable Helper</span>
          <input type="checkbox" id="syllable-toggle">
          <span class="toggle-switch"></span>
        </label>
      </div>
    </div>
  </div>
  <div id="settings-overlay" class="settings-overlay"></div>

  <!-- ===== READING RULER ===== -->
  <div id="reading-ruler" class="reading-ruler"></div>

  <!-- ===== APP CONTAINER ===== -->
  <div id="app" class="app-container">

    <!-- ===== TOP BAR ===== -->
    <header class="top-bar">
      <div class="logo">
        <span class="logo-icon">📖</span>
        <span class="logo-text">ReadBuddy</span>
      </div>
      <div class="top-actions">
        <button id="open-settings" class="icon-btn settings-btn" aria-label="Open settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
      <div class="build-stamp">Last push: Feb 8, 2026 — 6:00 PM</div>
    </header>

    <!-- ===== SCREEN: TOPIC PICKER ===== -->
    <main id="screen-topics" class="screen active">
      <div class="screen-content">
        <div class="hero-section">
          <div class="hero-greeting" id="hero-greeting">Let's Read!</div>
          <h1 class="main-title">What do you want to<br>read about?</h1>
          <p class="subtitle">Pick a topic or tell me what you like!</p>
        </div>

        <div class="voice-input-area">
          <div class="search-bar">
            <svg class="search-bar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="topic-input" class="topic-input" placeholder="Type a topic..." aria-label="Type a topic">
            <button id="topic-go-btn" class="topic-go-btn" aria-label="Go">GO</button>
          </div>
          <button id="voice-btn" class="voice-btn voice-btn-pill" aria-label="Say what you want to read about">
            <svg class="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
            <span class="voice-btn-label">Tap to Talk</span>
          </button>
          <p id="voice-status" class="voice-status"></p>
        </div>

        <div class="topics-divider">
          <span class="topics-divider-text">Popular Topics</span>
        </div>

        <div class="topic-grid" id="topic-grid">
          <!-- Topics injected by JS -->
        </div>
      </div>
    </main>

    <!-- ===== SCREEN: STORY LIST ===== -->
    <main id="screen-stories" class="screen">
      <div class="screen-content">
        <button id="back-to-topics" class="back-btn" aria-label="Go back to topics">&#8592; Back</button>
        <h1 id="stories-heading" class="section-title">Stories</h1>
        <div id="story-list" class="story-list">
          <!-- Story cards injected by JS -->
        </div>
      </div>
    </main>

    <!-- ===== SCREEN: READER ===== -->
    <main id="screen-reader" class="screen">
      <div class="screen-content reader-content">
        <button id="back-to-stories" class="back-btn" aria-label="Go back to stories">&#8592; Back</button>
        <h1 id="reader-title" class="reader-title"></h1>

        <!-- Reading Mode Selector -->
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="normal" aria-label="Normal reading mode">
            <span class="mode-icon">📖</span>
            <span class="mode-label">Read Along</span>
          </button>
          <button class="mode-btn" data-mode="word" aria-label="Word by word mode">
            <span class="mode-icon">🔤</span>
            <span class="mode-label">Word by Word</span>
          </button>
          <button class="mode-btn" data-mode="line" aria-label="Line by line mode">
            <span class="mode-icon">📝</span>
            <span class="mode-label">Line by Line</span>
          </button>
        </div>

        <!-- Progress bar for practice modes -->
        <div id="practice-progress" class="practice-progress hidden">
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
          <span id="progress-label" class="progress-label">0 / 0</span>
        </div>

        <!-- Status area for practice modes -->
        <div id="practice-status" class="practice-status hidden">
          <div id="practice-prompt" class="practice-prompt"></div>
          <div class="practice-actions">
            <button id="practice-mic-btn" class="practice-mic-btn" aria-label="Start speaking">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
              <span>Tap & Read Aloud</span>
            </button>
            <button id="practice-next-btn" class="practice-next-btn" aria-label="Next">
              <span>Next</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
          </div>
          <button id="practice-hear-btn" class="practice-hear-btn" aria-label="Hear the word">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.47 4.47 0 0 0 2.5-3.5z"/></svg>
            <span>Help Me</span>
          </button>
          <p id="practice-feedback" class="practice-feedback"></p>
        </div>

        <div class="reader-controls">
          <button id="read-aloud-btn" class="control-btn" aria-label="Read aloud">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.47 4.47 0 0 0 2.5-3.5zM14 3.23v2.06a6.5 6.5 0 0 1 0 13.42v2.06A8.5 8.5 0 0 0 14 3.23z"/></svg>
            <span>Read to Me</span>
          </button>
          <button id="stop-btn" class="control-btn hidden" aria-label="Stop reading">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            <span>Stop</span>
          </button>
        </div>

        <div id="reader-body" class="reader-body">
          <!-- Paragraphs injected by JS -->
        </div>

        <div id="word-bank" class="word-bank">
          <h3>Word Bank</h3>
          <div id="word-bank-list" class="word-bank-list">
            <!-- Words injected by JS -->
          </div>
        </div>

        <div class="reader-bottom-actions">
          <button id="take-quiz-btn" class="primary-btn quiz-launch-btn">Take the Quiz!</button>
        </div>
      </div>
    </main>

    <!-- ===== SCREEN: QUIZ ===== -->
    <main id="screen-quiz" class="screen">
      <div class="screen-content">
        <h1 class="section-title quiz-title">Quiz Time!</h1>
        <div id="quiz-body" class="quiz-body">
          <!-- Quiz injected by JS -->
        </div>
        <div id="quiz-result" class="quiz-result hidden"></div>

        <!-- Word Review Flashcard Game -->
        <div id="word-review" class="word-review hidden">
          <div class="wr-header">
            <div class="wr-title">Word Review</div>
            <div class="wr-subtitle">Do you know these words?</div>
            <div class="wr-progress-bar"><div class="wr-progress-fill"></div></div>
            <div class="wr-counter"><span id="wr-current">1</span> / <span id="wr-total">0</span></div>
          </div>

          <div class="wr-card-area">
            <div id="wr-stamp-got" class="wr-stamp wr-stamp-got">GOT IT</div>
            <div id="wr-stamp-miss" class="wr-stamp wr-stamp-miss">MISSED</div>
            <div id="wr-card" class="wr-card">
              <div class="wr-card-word" id="wr-card-word"></div>
              <div class="wr-card-syllables hidden" id="wr-card-syllables"></div>
              <button class="wr-card-speak" id="wr-card-speak" aria-label="Hear word">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
              </button>
            </div>
          </div>

          <div class="wr-actions">
            <button class="wr-btn wr-btn-miss" id="wr-miss-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span>Missed It</span>
            </button>
            <button class="wr-btn wr-btn-got" id="wr-got-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span>Got It!</span>
            </button>
          </div>
        </div>

        <!-- Word Review Results -->
        <div id="word-review-results" class="word-review-results hidden"></div>

        <div class="quiz-actions">
          <button id="quiz-done-btn" class="primary-btn hidden">Pick Another Story</button>
        </div>
      </div>
    </main>

  </div>

  <!-- ===== STATS OVERLAY ===== -->
  <div id="stats-overlay" class="stats-overlay">
    <div class="stats-sheet">
      <div class="stats-sheet-header">
        <button id="stats-close" class="stats-close" aria-label="Close stats">&times;</button>
        <h2 class="stats-sheet-title">Your Progress</h2>
      </div>
      <div class="stats-sheet-body" id="stats-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>

  <script src="config.js?v=20260208-2000"></script>
  <script src="stories.js?v=20260208-2000"></script>
  <script src="app.js?v=20260208-2000"></script>
</body>
</html>
